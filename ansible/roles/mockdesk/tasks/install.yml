---
- name: Install base packages
  ansible.builtin.apt:
    name: [curl, ca-certificates, gnupg, tar, sqlite3]
    update_cache: true
    cache_valid_time: 3600

- name: Add the NodeSource key and repository for Node.js {{ node_major }}
  ansible.builtin.shell: |
    set -e
    install -d -m 0755 /etc/apt/keyrings
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor --yes -o /etc/apt/keyrings/nodesource.gpg
    echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
  args:
    creates: /etc/apt/sources.list.d/nodesource.list
    executable: /bin/bash

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    update_cache: true

- name: Create the service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ base_dir }}"
    create_home: false

- name: Create the folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - "{{ base_dir }}"
    - "{{ base_dir }}/releases"
    - "{{ data_dir }}"
    - "{{ data_dir }}/uploads"

- name: Write the settings file (/etc/mockdesk.env)
  ansible.builtin.template:
    src: mockdesk.env.j2
    dest: /etc/mockdesk.env
    owner: root
    group: "{{ app_user }}"
    mode: "0640"

- name: Install the systemd service
  ansible.builtin.template:
    src: mockdesk.service.j2
    dest: /etc/systemd/system/mockdesk.service
    mode: "0644"

- name: Enable the service at boot
  ansible.builtin.systemd:
    name: mockdesk
    enabled: true
    daemon_reload: true
